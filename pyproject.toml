[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-maaend-adapter"
version = "0.0.0"
description = "MaaEnd specialized script adapter for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:maaend_adapter"]
dependencies = ["auto-mas-core>=5.9.0b1,<6"]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/automas-maaend-adapter/blob/master/CHANGELOG.md"
Documentation = "https://doc.auto-mas.top/developer/"
Homepage = "https://auto-mas.top"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maaend_adapter = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["maaend_adapter"]
known-third-party = ["app", "auto_mas_core"]
