[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "auto-mas-maaend-adapter"
version = "0.0.0"
description = "MaaEnd specialized script adapter for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:maaend_adapter"]
dependencies = [
  "auto-mas-core>=5.9.0b1,<6",
  # MaaFramework 的 interface 解析、任务选项与预任务计划由 MaaFW 适配器拆出的库提供。
  "auto-mas-maafw-interface>=0.2.0,<0.3",
]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaEnd-Adapter/blob/main/CHANGELOG.md"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaEnd-Adapter"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaEnd-Adapter/issues"
Documentation = "https://doc.auto-mas.top/developer/"
Homepage = "https://auto-mas.top"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["auto_mas_maaend_adapter"]
known-third-party = ["app", "auto_mas_core"]